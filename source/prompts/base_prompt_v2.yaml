get_question_prompt:
  description: Full prompt for generating a natural language question.
  template: |
    Your task is to generate a **new, clear, and specific natural language question** based on the provided database structure and examples. This question should be suitable for translation into SQL.

    DATABASE INFO:
    {{ table_info }}

    DATABASE SCHEMA:
    {{ table_schema }}
    
    Clean Table random samples:
    {{ table_clean }}

    Dirty Table random samples:
    {{ table_dirty }}

    {% if vector_store %}
    NOTE: The library already contains {{ vector_store_size }} questions.
    Recent questions (up to 3):
    {{ example_questions }}

    Your new question should match the complexity of prior ones, but avoid duplicates. Prefer different tables, columns, or relationships.
    {% endif %}

    {% if not is_inside %}
    NOTE: A previous question was found to be **{{ inside_difficulty }}**:
    > "{{ inside_question }}"

    Please generate a new question that **modifies or replaces** the above one to correct for this issue.
    {% endif %}

    You may only use the **Dirty Table random samples** to inform your question. Do **not** rely on data not shown above.

    **Requirements:**
    1. The question must be answerable using the database schema and dirty table headers.
    2. It must be specific enough for SQL translation.
    3. Do not include or refer to SQL or code in the question.
    4. Use only the **dirty table headers** to reference columns.
    5. Use the `retriever_tool` to validate your question.
    6. Format your response like this:

    ```py
    final_answer(retriever_tool("YOUR GENERATED QUESTION HERE"))
    ```

    Return only the code above—**no extra text or formatting**.

get_traductor_prompt:
  description: Template to instruct the LLM to translate a natural language question into SQL.
  template: |
    You are an expert system that converts a natural language question into a single valid SQL query using the given database schema.

    ---

    DATABASE INFORMATION:
    {{ table_info }}

    DATABASE SCHEMA:
    {{ table_schema }}

    RAW (UNSTRUCTURED) DATA SAMPLES:
    {{ table_dirty }}

    CLEAN (STRUCTURED) DATA SAMPLES:
    {{ table_clean }}

    ---

    USER QUESTION:
    {{ question }}

    ---

    INSTRUCTIONS:

    Your task is to generate **one valid SQL query** that answers the user's question using the database schema and data structure.

    Follow these rules carefully:

    1. **Generate only one SQL query**, stored in a variable called `sql_query`.
    2. Select only the columns necessary to answer the question, with a maximum of two columns in the SELECT clause.
    3. You must then **verify the query** by running: `execute_sql(sql_query)`
    4. ONLY AFTER the SQL query runs correctly, you must return the final answer using:

    ```python
    final_answer(execute_sql(sql_query))
        ```



get_extra_prompt_divers:
  description: Prompt for generating paraphrased variations of a natural language question that maps to a given SQL query.
  template: |
    You are a **question paraphrasing expert**.

    Original question: {{ question }}
    Its Corresponding SQL query: {{ sql_question }}

    Table:
    {{ table_dirty }}

    Your task is to create 7 different variants of the original question using the following techniques:

    1. BASIC SIMPLIFICATION
    • Remove non-essential elements while preserving the main meaning.
    • Example: "Which club has the most female students as their members?" → "Which club has the most female students?"

    2. SIMPLIFICATION BY HIDING DETAILS
    • Preserve the central objective but remove additional explanations.
    • Example: "What is the title and credits of the course that is taught in the largest classroom?" → "What course is taught in the biggest classroom and what are its credits?"

    3. USING SYNONYMS
    • Replace certain terms with their synonyms while maintaining meaning.
    • Example: "What is the average duration in milliseconds of tracks that belong to Latin or Pop genre?" → "What is the mean length in milliseconds of Latin or Pop songs?"

    4. SEMANTIC SUBSTITUTIONS
    • Replace expressions with semantically equivalent alternatives.
    • Example: "What are the locations that have gas stations owned by a company with a market value greater than 100?" → "Where are the gas stations owned by a company worth more than 100?"

    5. COMPLETE REFORMULATION
    • Express the same request in a totally different way.
    • Example: "What is the number of routes operated by American Airlines whose destinations are in Italy?" → "How many routes does American Airlines have that fly to Italy?"

    6. SIMPLIFICATION WITH MORE DIRECT LANGUAGE
    • Use more direct and concise language.
    • Example: "What are the names of body builders whose total score is higher than 300?" → "Who are the body builders with a score over 300?"

    7. PARAPHRASE WITH CHANGE OF PERSPECTIVE
    • Reformulate by changing the style or perspective of the question.
    • Example: "Return the categories of music festivals that have the result 'Awarded'" → "List the categories of music festivals that have been recognized with awards"

    For each original SQL question provided, please generate all 7 variants following these techniques without changing the SQL request.
    Make sure to keep the SQL query unchanged.

    Return a JSON array with the following format (no additional text):

    ```py
    final_answer([
        { "technique": "BASIC SIMPLIFICATION", "question": "..." },
        { "technique": "SIMPLIFICATION BY HIDING DETAILS", "question": "..." },
        { "technique": "USING SYNONYMS", "question": "..." },
        { "technique": "SEMANTIC SUBSTITUTIONS", "question": "..." },
        { "technique": "COMPLETE REFORMULATION", "question": "..." },
        { "technique": "SIMPLIFICATION WITH MORE DIRECT LANGUAGE", "question": "..." },
        { "technique": "PARAPHRASE WITH CHANGE OF PERSPECTIVE", "question": "..." }
    ])
    ```
